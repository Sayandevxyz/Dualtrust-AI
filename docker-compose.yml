version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    container_name: dualtrust_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dualtrust}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dualtrust_dev}
      POSTGRES_DB: ${POSTGRES_DB:-dualtrust}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dualtrust"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: dualtrust_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dualtrust_backend
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - document_storage:/app/storage/documents
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dualtrust_worker
    env_file: .env
    volumes:
      - ./backend:/app
      - document_storage:/app/storage/documents
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: rq worker --with-scheduler --url ${REDIS_URL:-redis://redis:6379/0}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dualtrust_frontend
    env_file: .env
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/src:/app/src
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  document_storage:
